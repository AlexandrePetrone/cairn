framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" pool holds what the processes of an instance share and what must outlive
        # them: the state of the schedule (App\Schedule), the rate limiters, the signal of
        # "messenger:stop-workers". In the database, so that the web server and the worker need
        # no folder in common.
        app: cache.adapter.doctrine_dbal

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

when@test:
    framework:
        cache:
            # One pool per ParaTest worker (TEST_TOKEN): tests clear the rate limiters they count on,
            # which the transaction around each test would not let them do in the database.
            app: cache.adapter.filesystem
            directory: '%kernel.cache_dir%/pools/app%env(default::TEST_TOKEN)%'
