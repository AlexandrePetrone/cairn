framework:
    # Held by PostgreSQL itself (an advisory lock of the session), so shared by every process of
    # the instance, wherever it runs, without a table: it never expires, and goes with the
    # connection of a process that dies. A transaction neither takes nor releases it, so the
    # connection of the application does.
    lock:
        service_id: doctrine.dbal.default_connection
        advisory: true

when@test:
    framework:
        # Each ParaTest worker changes its own configuration, in its own database.
        lock: in-memory
