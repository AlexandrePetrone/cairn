security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                # Loaded by UserRepository::loadUserByIdentifier(), which normalises the email.
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        webhook:
            # The forges deliver here, authenticated by the secret of the
            # repository named in the payload (Forge/GitLab/GitLabRequestParser):
            # no session, no user, no CSRF.
            pattern: ^/webhook/
            security: false
        api:
            # The REST API and the MCP server: a personal token in the
            # Authorization header (Security/ApiTokenHandler), no session, so
            # no cookie signs a request in and no CSRF token is needed. The
            # documentation of the API is a page of the application, left to
            # the `main` firewall.
            pattern: ^/(api(?!/docs)|mcp)(/|$)
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            access_token:
                token_handler: App\Security\ApiTokenHandler
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600 # 2 weeks
                signature_properties: ['password']
            # Brute force: five failed attempts per email and per IP, then a 15 minute wait.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/password, roles: PUBLIC_ACCESS } # forgot password, set the password from a link
        - { path: ^/storia, roles: PUBLIC_ACCESS } # dev only: the bundle is disabled in prod
        # The API: its documentation is read signed in, by those who may use
        # it (AccessControl::canUseApi(): the internal users); reading the API
        # needs a token with the `read` scope, anything else `write`
        # (Security/Voter/ApiScopeVoter).
        - { path: ^/api/docs, roles: ROLE_INTERNAL }
        - { path: ^/api(/|$), methods: [GET, HEAD], roles: api.read }
        - { path: ^/api(/|$), roles: api.write }
        # The MCP server: every request is a POST, so a token opens the door
        # and each tool asks for its own scope (src/Api/Mcp).
        - { path: ^/mcp(/|$), roles: api.read }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
