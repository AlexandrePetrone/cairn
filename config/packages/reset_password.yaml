# Single-use tokens behind the invitation and "forgot password" mails
# (Security/PasswordTokens). `lifetime` is the reset link's; an invitation
# asks for its own, longer one. A second request within `throttle_limit`
# is refused, which the forgot-password page hides; a resent invitation
# removes the previous request first.
symfonycasts_reset_password:
    request_password_repository: App\Repository\PasswordTokenRepository
    lifetime: 3600
    throttle_limit: 300
    enable_garbage_collection: true
