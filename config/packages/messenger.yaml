framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []
            # Write commands (src/Message/Command/), handled synchronously:
            # each one is validated, then runs in a Doctrine transaction.
            command.bus:
                middleware:
                    - validation
                    - doctrine_transaction
            # Screen reads (src/Message/Query/): validated, no transaction.
            query.bus:
                middleware:
                    - validation

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            # Notifications leave after the command's transaction committed
            # (Notification/NotificationDispatcher) and are handled by a
            # worker: `messenger:consume async`.
            App\Message\Notification\NotifyIssueChange: async
            # A forge delivery is answered at once and recorded by the worker.
            Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage: async

# Tests look at what a command dispatched (the `async` transport in
# memory) and read the mails a notification built, so mails are sent on
# the spot, to the `null://` mailer of the test environment.
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                sync: 'sync://'
            routing:
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
