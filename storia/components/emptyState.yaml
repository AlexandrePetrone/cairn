component: Ui:EmptyState
variants:
    default:
        args: { title: No issue matches, icon: search }
        blocks:
            content: Try widening the filters or showing closed issues.
            actions: '<a href="#" class="inline-flex h-7 items-center rounded-md border border-gray-300 bg-white px-2 text-xs text-gray-700 hover:bg-gray-50">Clear all</a>'
    small_bordered:
        args: { title: No issues, icon: kanban, size: sm, bordered: true }
    amber:
        args: { title: No access, icon: lock, tone: amber, bordered: true }
        blocks:
            content: This user sees no project until they are given access to a workspace or a project.
