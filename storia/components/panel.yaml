component: Ui:Panel
variants:
    default:
        args: { title: Assigned to me, count: 4, href: '#' }
        blocks:
            content: '<ul class="divide-y divide-line-subtle"><li class="px-4 py-2">One row</li><li class="px-4 py-2">Another one</li></ul>'
    muted_with_footer:
        args: { title: Inherited from the workspace, muted: true, href: '#', hrefLabel: Edit in the workspace }
        blocks:
            content: '<div class="p-4 text-sm text-muted">Content</div>'
            footer: Direct access can only widen an inherited role.
    bare:
        blocks:
            content: '<div class="p-4 text-sm">Without header</div>'
