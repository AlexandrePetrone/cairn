component: Ui:Button
variants:
    primary: { args: { variant: primary, icon: plus }, blocks: { content: New issue } }
    secondary: { blocks: { content: Edit } }
    danger: { args: { variant: danger }, blocks: { content: Refuse } }
    dark: { args: { variant: dark, type: submit }, blocks: { content: Save } }
    success: { args: { variant: success }, blocks: { content: Mark as delivered } }
    ghost: { args: { variant: ghost }, blocks: { content: Cancel } }
    icon: { args: { variant: icon, icon: ellipsis } }
    as_link: { args: { href: '#', icon: plus }, blocks: { content: Add } }
