; The timezone of the instance, TZ: the one its dates are shown in. They are stored in UTC.
date.timezone = ${TZ:-UTC}
expose_php = 0
; An import handles an archive of issues batch by batch, in the worker.
memory_limit = 512M
; Attachments go up to 10 MB.
upload_max_filesize = 10M
post_max_size = 12M
session.use_strict_mode = 1
zend.detect_unicode = 0

; The code of an image never changes: nothing is checked again, and the classes the cache
; warmup listed are loaded once, when the server starts.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data
realpath_cache_size = 4096K
realpath_cache_ttl = 600
