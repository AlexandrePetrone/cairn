date.timezone = UTC
; The full PHPUnit suite needs more than the 128M default in one process.
memory_limit = 1G
; Attachments go up to 10 MB.
upload_max_filesize = 10M
post_max_size = 12M
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0
opcache.enable_cli = 0
; Every rebuild of the dev cache leaves its old files as wasted memory. With the defaults (128M,
; 10000 files, 5% wasted) opcache restarts several times a day, and a restart under FrankenPHP's
; threads ends in "zend_mm_heap corrupted": the server dies. Sized so that it does not come to that.
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.max_wasted_percentage = 50

; Xdebug: off by default (XDEBUG_MODE in compose.yaml), the IDE listens on the host.
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
