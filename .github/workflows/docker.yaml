name: Docker image

# Builds the production image (the "prod" target of the Dockerfile), starts it the way an operator
# would, then publishes it to the registry of GitHub, as ghcr.io/<owner>/<repository>:
#
#   main            -> edge
#   a tag 0.4.2     -> 0.4.2, 0.4 and latest
#
# "latest" is the last release, never the main branch.
# A pull request builds and starts the image without publishing it.
#
# Each architecture is built and started on a machine of its own kind, both at once: nothing is
# emulated, which took a quarter of an hour for arm64. The two images are then named as one.
#
# Nothing to set: the token of the workflow signs in, and the package is as public as the
# repository it is published from.

on:
    push:
        branches: [main]
        tags: ['[0-9]+.[0-9]+.[0-9]+*']
    pull_request:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    build:
        name: Image (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        outputs:
            # Each job of the matrix fills its own.
            amd64: ${{ steps.digest.outputs.amd64 }}
            arm64: ${{ steps.digest.outputs.arm64 }}
        steps:
            - uses: actions/checkout@v7

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build the image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: prod
                  load: true
                  tags: cairn:ci
                  cache-from: type=gha,scope=${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

            - name: Start an instance from it
              run: docker/smoke-test.sh cairn:ci

            - name: Label the image
              id: meta
              if: github.event_name == 'push'
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}

            - name: Sign in to the registry
              if: github.event_name == 'push'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The image just built and started, from the cache: sent without a name, which the
            # "publish" job gives to both architectures together.
            - name: Send the image to the registry
              id: push
              if: github.event_name == 'push'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: prod
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ matrix.arch }}

            - name: Keep its digest
              id: digest
              if: github.event_name == 'push'
              run: echo "${{ matrix.arch }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

    publish:
        name: Publish
        needs: build
        if: github.event_name == 'push'
        runs-on: ubuntu-24.04
        steps:
            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Name the versions
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=edge,branch=main
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - name: Sign in to the registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Name the two images as one
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  set --
                  for tag in $TAGS; do set -- "$@" --tag "$tag"; done
                  docker buildx imagetools create "$@" \
                      "$IMAGE@${{ needs.build.outputs.amd64 }}" \
                      "$IMAGE@${{ needs.build.outputs.arm64 }}"
