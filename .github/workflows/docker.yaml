name: Docker image

# Builds the production image (the "prod" target of the Dockerfile), starts it the way an operator
# would, then publishes it to the registry of GitHub, as ghcr.io/<owner>/<repository>:
#
#   main            -> edge
#   a tag 0.4.2     -> 0.4.2 and 0.4
#
# No "latest": until the schema has migrations, a new version promises no upgrade (README).
# A pull request builds and starts the image without publishing it.
#
# Nothing to set: the token of the workflow signs in, and the package is as public as the
# repository it is published from.

on:
    push:
        branches: [main]
        tags: ['[0-9]+.[0-9]+.[0-9]+*']
    pull_request:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        name: Production image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build the image for this machine
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: prod
                  load: true
                  tags: cairn:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Start an instance from it
              run: docker/smoke-test.sh cairn:ci

            - name: Name the versions
              id: meta
              if: github.event_name == 'push'
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  flavor: latest=false
                  tags: |
                      type=edge,branch=main
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - name: Sign in to the registry
              if: steps.meta.outcome == 'success'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The dependencies and the assets are built once, on this machine; only the last
            # stages run for each architecture.
            - name: Build for both architectures and publish
              if: steps.meta.outcome == 'success'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: prod
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
