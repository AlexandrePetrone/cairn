<form name="field" method="post">
                <div  >
            <label for="field" class="block font-medium text-sm text-gray-800">
            Company
                                </label>
                        <div class="relative" data-controller="combobox" >
    <input type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" class="mt-1 w-full h-9 rounded-md border border-gray-300 bg-white px-3 text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 disabled:cursor-not-allowed disabled:bg-gray-50 disabled:text-gray-500"
           data-combobox-target="input" data-action="input->combobox#filter focus->combobox#open keydown->combobox#navigate"
            id="field" name="field" aria-describedby="field_help">
    <ul role="listbox" hidden data-combobox-target="list" class="absolute left-0 right-0 top-full z-50 mt-1 max-h-56 overflow-y-auto rounded-lg border border-gray-200 bg-white py-1 shadow-xl">
                    <li><button type="button" role="option" tabindex="-1" data-combobox-target="option" data-action="combobox#choose" class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50 aria-selected:bg-indigo-50 aria-selected:text-indigo-700">Maison Dupont</button></li>
                    <li><button type="button" role="option" tabindex="-1" data-combobox-target="option" data-action="combobox#choose" class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50 aria-selected:bg-indigo-50 aria-selected:text-indigo-700">Natura</button></li>
                    <li><button type="button" role="option" tabindex="-1" data-combobox-target="option" data-action="combobox#choose" class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50 aria-selected:bg-indigo-50 aria-selected:text-indigo-700">Travelia</button></li>
            </ul>
</div>


            <p id="field_help" class="mt-1 text-xs text-gray-400">The organisation the person works for; the companies already known are suggested.</p>        </div>

</form>
