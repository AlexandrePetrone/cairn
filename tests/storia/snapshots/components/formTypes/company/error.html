<form name="field" method="post">
                <div  >
            <label for="field" class="block font-medium text-sm text-body">
            Company
                                </label>
                        <div class="relative" data-controller="combobox" >
    <input type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" class="mt-1 w-full h-9 rounded-md border border-line-strong bg-surface px-3 text-sm focus:border-focus focus:outline-none focus:ring-2 focus:ring-brand-line disabled:cursor-not-allowed disabled:bg-subtle disabled:text-muted border-red-solid focus:border-red-solid focus:ring-red-line"
           data-combobox-target="input" data-action="input->combobox#filter focus->combobox#open keydown->combobox#navigate"
            id="field" name="field" aria-describedby="field_help">
    <ul role="listbox" hidden data-combobox-target="list" class="absolute left-0 right-0 top-full z-50 mt-1 max-h-56 overflow-y-auto rounded-lg border border-line bg-overlay py-1 shadow-xl">
                    <li><button type="button" role="option" tabindex="-1" data-combobox-target="option" data-action="combobox#choose" class="block w-full px-3 py-1.5 text-left text-sm text-body hover:bg-subtle aria-selected:bg-brand-soft aria-selected:text-brand">Maison Dupont</button></li>
                    <li><button type="button" role="option" tabindex="-1" data-combobox-target="option" data-action="combobox#choose" class="block w-full px-3 py-1.5 text-left text-sm text-body hover:bg-subtle aria-selected:bg-brand-soft aria-selected:text-brand">Natura</button></li>
                    <li><button type="button" role="option" tabindex="-1" data-combobox-target="option" data-action="combobox#choose" class="block w-full px-3 py-1.5 text-left text-sm text-body hover:bg-subtle aria-selected:bg-brand-soft aria-selected:text-brand">Travelia</button></li>
            </ul>
</div>


            <p id="field_help" class="mt-1 text-xs text-faint">The organisation the person works for; the companies already known are suggested.</p>                <ul class="mt-1 space-y-0.5 text-xs text-red">
            <li>This value is not valid.</li>        </ul>
    </div>

</form>
