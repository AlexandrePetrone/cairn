# Development stack, driven by castor.php ("castor install", "castor start", ...).
# Production runs on a plain server: see the README.

# Everything the PHP services share: image, code bind mount and environment.
x-php: &php
  build: .
  image: cairn-php-dev
  volumes:
    # var/ stays in the bind mount on purpose: var/log is readable from the host, and the
    # filesystem cache.app pool must be shared so "messenger:stop-workers" reaches the consumer.
    - ./:/app
  environment: &php-environment
    DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8
    DEFAULT_URI: http://localhost:${HTTP_PORT:-8000}
    # Mailpit (the "mailer" service below); its inbox is http://localhost:8025.
    MAILER_DSN: smtp://mailer:1025
    # Real time: the hub built into FrankenPHP (docker/Caddyfile), reached by the application
    # inside the stack and by the browser at the address of the site.
    MERCURE_URL: http://php/.well-known/mercure
    MERCURE_PUBLIC_URL: http://localhost:${HTTP_PORT:-8000}/.well-known/mercure
    # Read by vite.config.ts: the address the browser reaches the dev server at.
    VITE_PORT: ${VITE_PORT:-5173}
    # See https://xdebug.org/docs/all_settings#mode
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  depends_on:
    database:
      condition: service_healthy
  extra_hosts:
    # Ensure that host.docker.internal is correctly defined on Linux
    - host.docker.internal:host-gateway

services:
  php:
    <<: *php
    ports:
      - "${HTTP_PORT:-8000}:80"
      - "9443:9443"
    environment:
      <<: *php-environment
      # One more site for the Caddy of FrankenPHP (docker/Caddyfile): Authelia over HTTPS, which
      # both it and the OpenID Connect login require. A *.localhost name is this container for
      # PHP and the host for the browser, hence the same port on both sides. PHP trusts the
      # certificate because Caddy installs its authority in the container.
      CADDY_EXTRA_CONFIG: |
        https://authelia.localhost:9443 {
            tls internal
            reverse_proxy authelia:9091
        }
    tty: true
    # Comes back by itself if FrankenPHP crashes.
    restart: unless-stopped

  # Where castor runs everything (console, composer, npm, the tests and the linters): the same
  # image doing nothing, so that the web server going down or restarting never takes them along.
  cli:
    <<: *php
    healthcheck:
      disable: true
    command: sleep infinity
    init: true
    restart: unless-stopped

  # Notification mails (async) and the daily tasks (scheduler_default). It exits after an hour or on
  # "messenger:stop-workers" ("castor workers:restart"), and compose starts it again.
  messenger:
    <<: *php
    # No Caddy here: the image healthcheck (Caddy metrics) does not apply.
    healthcheck:
      disable: true
    command: bin/console messenger:consume async scheduler_default --time-limit=3600 -vv
    restart: unless-stopped

  # Vite dev server with hot reload; public/build/entrypoints.json points the pages at it.
  vite:
    <<: *php
    healthcheck:
      disable: true
    command: npx vite --host 0.0.0.0 --port ${VITE_PORT:-5173} --strictPort
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    restart: unless-stopped

  # Live reload of the component catalogue (/storia).
  storia:
    <<: *php
    healthcheck:
      disable: true
    command: bin/console storia:watch
    restart: unless-stopped

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PostgreSQL 18 keeps its data in a version folder under /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql:rw
###< doctrine/doctrine-bundle ###

  # Catches every email the application sends: http://localhost:8025.
###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  # The identity provider of the SSO accounts (OIDC_* in .env.dev), at https://authelia.localhost:9443
  # through the Caddy of `php`: "lea" has an account in the development data, "hugo" has none,
  # both with the password "cairn" (docker/authelia/).
  authelia:
    image: authelia/authelia:4.39
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
    # The key that signs the ID tokens is made once, in the volume, instead of being committed.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /data/oidc.private.pem ] || authelia crypto pair rsa generate --directory /data --file.private-key oidc.private.pem --file.public-key oidc.public.pem
        exec authelia --config /config/configuration.yml
    volumes:
      - ./docker/authelia:/config:ro
      - authelia_data:/data
    restart: unless-stopped

volumes:
  authelia_data:
###> doctrine/doctrine-bundle ###
  postgres_data:
###< doctrine/doctrine-bundle ###
