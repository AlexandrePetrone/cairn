            help: Choisir qui traite une demande, parmi les membres du projet.
        set_criticality:
            label: Changer la criticité
            help: Passer une demande en basse, normale, haute ou bloquante.
        set_private:
            label: Rendre une demande privée
            help: La cacher aux externes, ou la leur montrer à nouveau.
        link:
            label: Lier des demandes
            help: Lier une demande à une autre, ou retirer un lien. Entre projets pour les internes seulement.
        set_release:
            label: Rattacher une demande à une version
            help: Placer une demande dans une version ouverte du projet, ou l'en retirer.
    comment:
        create:
            label: Commenter
            help: Écrire dans le fil d'une demande.
        set_private:
            label: Écrire des commentaires privés
            help: Un commentaire privé et ses fichiers ne sont vus que des internes.
        edit:
            label: Modifier les commentaires des autres
            help: Réécrire ou supprimer le commentaire de quelqu'un d'autre. L'auteur gère toujours le sien.
    project:
        configure:
            label: Configurer le projet
            help: Changer son nom et sa description, créer, ordonner et désactiver ses catégories.
        manage_members:
            label: Gérer les accès du projet
            help: Accorder, changer et retirer les rôles détenus sur le projet lui-même. Les rôles d'espace restent à l'administration.
    release:
        manage:
            label: Gérer les versions
            help: Créer les versions du projet, les modifier, les marquer livrées ou abandonnées.

field_type:
    text: Texte court
    textarea: Texte long
    rich_text: Texte mis en forme
    select: Liste déroulante
    choice: Choix unique
    number: Nombre
    date: Date
    url: Adresse web
    bool: Oui / non

migration_policy:
    strict:
        label: Stricte
        help: si une étape disparaît sans successeur déclaré (migrate_from), la synchronisation est refusée et la configuration précédente reste en vigueur.
    fallback:
        label: Repli
        help: les demandes posées sur une étape qui disparaît vont à l'étape de repli de leur workflow.
