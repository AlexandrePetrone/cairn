migration_policy:
    strict:
        label: Stricte
        help: si une étape disparaît sans successeur déclaré (migrate_from), la synchronisation est refusée et la configuration précédente reste en vigueur.
    fallback:
        label: Repli
        help: les demandes posées sur une étape qui disparaît vont à l'étape de repli de leur workflow.
