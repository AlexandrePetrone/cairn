            label: Commenter
            help: Écrire dans le fil d'une demande.
        set_private:
            label: Écrire des commentaires privés
            help: Un commentaire privé et ses fichiers ne sont vus que des internes.
        edit:
            label: Modifier les commentaires des autres
            help: Réécrire ou supprimer le commentaire de quelqu'un d'autre. L'auteur gère toujours le sien.

