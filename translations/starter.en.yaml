# Labels of the starter configuration (Config\StarterKit): read once, when it is
# installed, in the language of the instance, then stored as data like any other.
role:
    project_manager: 'Project manager'
    developer: Developer
    client: Client
    partner: Partner
place:
    new: New
    needs_info: 'Details requested'
    to_do: 'To do'
    feedback: Feedback
    to_estimate: 'To estimate'
    to_approve: 'Estimate to approve'
    planned: Planned
    in_progress: 'In progress'
    blocked: Blocked
    to_test: 'To test'
    to_release: 'To release'
    done: Done
    declined: Cancelled
field:
    url:
        label: 'Affected URL'
        placeholder: 'https://…'
        help: 'The URL where the problem occurs.'
    due_date:
        label: 'Desired due date'
link:
    related:
        label: 'Related to'
    duplicates:
        label: Duplicates
        inverse: 'Duplicated by'
    blocks:
        label: Blocks
        inverse: 'Blocked by'
workflow:
    bug:
        label: Bug
        transition:
            acknowledge:
                label: 'Accept the answer'
                description: 'The explanation answers the question: the issue is closed.'
            insist:
                label: 'Dispute the answer'
                description: 'The explanation does not answer the question: the issue goes back to the team.'
                prompt: 'Say what is still not right.'
            provide_info:
                label: 'Provide details'
                description: 'The details are given: the issue goes back to the team.'
            accept:
                label: 'Accept delivery'
                description: 'The fix is accepted: it waits for its release to production.'
            refuse:
                label: 'Refuse delivery'
                description: 'The fix is not right: the issue goes back to development, with the comment that says why.'
                prompt: 'Explain what is wrong: a comment is required to refuse.'
    evolution:
        label: Feature
        transition:
            acknowledge:
                label: 'Accept the answer'
                description: 'The explanation answers the question: the issue is closed.'
            insist:
                label: 'Dispute the answer'
                description: 'The explanation does not answer the question: the issue goes back to the team.'
                prompt: 'Say what is still not right.'
            approve:
                label: 'Accept the estimate'
                description: 'The estimate is accepted: the feature is planned.'
            decline_estimate:
                label: 'Cancel the request'
                description: 'The client gives up the feature in view of the estimate: the issue is cancelled.'
            accept:
                label: 'Accept delivery'
                description: 'The feature matches the request: it waits for its release to production.'
            refuse:
                label: 'Refuse delivery'
                description: 'The feature does not match the request: it goes back to development, with the comment that says why.'
                prompt: 'Explain what does not match the request: a comment is required to refuse.'
    task:
        label: 'Internal task'
template:
    name: 'Web project'
    description: 'Bugs, features and internal tasks, issues handed to the referent project manager.'
    tracker:
        bug: 'Something no longer works as before.'
        evolution: 'A new feature or an improvement.'
        task: 'Technical work without a client request.'
    rule:
        to_manager: 'New issue to the project manager'
        client_answers: 'The client answers: back to the project manager'
        reminder: 'Reminder to the client'
        reminder_body: 'This issue has been waiting for your answer for 30 days. Without news from you, it will be closed in 15 days; it can always be reopened.'
        closing: 'Closing without an answer'
