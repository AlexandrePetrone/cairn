migration_policy:
    strict:
        label: Strict
        help: when a place disappears without a declared successor (migrate_from), the sync is refused and the previous configuration stays in force.
    fallback:
        label: Fallback
        help: the issues sitting on a place that disappears move to the fallback place of their workflow.
