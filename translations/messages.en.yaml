permission:
    issue:
        create:
            label: Create issues
            help: Open an issue in the trackers they can see.
        edit:
            label: Edit the issues of others
            help: Title, description, fields and files of an issue written by someone else. Authors always edit their own.
        change_tracker:
            label: Change the tracker of an issue
            help: Move an issue to another tracker of the project, choosing its place in the new workflow.
        force_place:
            label: Move an issue to any step
            help: Put an issue on any step of its workflow without going through an action, to fix a mistake; the history keeps the move.
        rank:
            label: Arrange the kanban
            help: 'Drag the cards of a kanban column into the order wanted; everyone sees the same order.'
        assign:
            label: Assign issues
            help: Choose who handles an issue, among the members of the project.
        set_criticality:
            label: Change the criticality
            help: Set an issue to low, normal, high or blocking.
        set_private:
            label: Make an issue private
            help: Hide it from external users, or show it to them again.
        link:
            label: Link issues
            help: Link an issue to another one, or remove a link. Across projects for internal users only.
        set_release:
            label: Schedule issues in a release
            help: Put an issue in an open release of the project, or take it out.
    comment:
        create:
            label: Comment
            help: Write in the thread of an issue.
        set_private:
            label: Write private comments
            help: A private comment and its files are seen by internal users only.
        edit:
            label: Edit the comments of others
            help: Rewrite or delete someone else's comment. Authors always handle their own.
    project:
        configure:
            label: Configure the project
            help: Change its name and description, create, arrange and deactivate its trackers.
        manage_members:
            label: Manage access to the project
            help: Grant, change and revoke the roles held on the project itself. Workspace roles stay with the administration.
    release:
        manage:
            label: Manage releases
            help: Create the releases of the project, change them, mark them delivered or abandoned.

