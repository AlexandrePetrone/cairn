# Labels of the starter configuration (Config\StarterKit): read once, when it is
# installed, in the language of the instance, then stored as data like any other.
role:
    project_manager: 'Chef de projet'
    developer: Développeur
    client: Client
    client_readonly: 'Client (lecture)'
place:
    new: Nouvelle
    needs_info: 'Info demandée'
    qualified: Qualifiée
    to_estimate: 'À chiffrer'
    to_approve: 'Chiffrage à valider'
    planned: Planifiée
    in_progress: 'En cours'
    blocked: Bloquée
    to_test: 'À recetter'
    to_release: 'À mettre en production'
    done: Terminée
    declined: Refusée
field:
    environment:
        label: Environnement
        option:
            prod: Production
            preprod: Préproduction
    url:
        label: 'URL concernée'
        placeholder: 'https://…'
        help: "L'URL où le problème se produit."
    steps:
        label: 'Étapes pour reproduire'
        placeholder: '1. Je vais sur… 2. Je clique sur… 3. Je constate…'
        help: "Ce que vous avez fait, ce que vous attendiez, ce qui s'est passé."
    browser:
        label: Contexte
        placeholder: 'Chrome 130 sur macOS, Safari iPhone, compte utilisé…'
    goal:
        label: Objectif
        placeholder: 'Quel problème cette évolution résout-elle, pour qui ?'
        help: 'Le besoin plutôt que la solution : ça nous aide à proposer la bonne réponse.'
    due_date:
        label: 'Échéance souhaitée'
link:
    related:
        label: 'Lié à'
    duplicates:
        label: 'Doublon de'
        inverse: 'Dupliqué par'
    blocks:
        label: Bloque
        inverse: 'Bloqué par'
workflow:
    bug:
        label: Anomalie
        transition:
            ask_info:
                label: 'Demander des précisions'
                description: "Il manque des éléments pour comprendre l'anomalie : la demande attend la réponse du client."
                prompt: "Précisez ce qu'il nous manque pour reproduire le problème."
            provide_info:
                label: Répondre
                description: "Les précisions sont apportées : la demande revient à l'équipe."
            qualify:
                label: Qualifier
                description: "L'anomalie est comprise et reproduite : elle entre dans la file de l'équipe."
            reject:
                label: Rejeter
                description: "Ce n'est pas une anomalie, ou elle ne sera pas corrigée : la demande est fermée."
            start:
                label: Démarrer
                description: 'La correction commence.'
            block:
                label: Bloquer
                description: "La correction ne peut pas avancer : elle dépend d'un tiers ou d'un prérequis."
                prompt: 'Indiquez ce qui bloque et qui doit le lever.'
            resume:
                label: Reprendre
                description: 'Le blocage est levé : la correction reprend.'
            deliver:
                label: 'Livrer en recette'
                description: 'La correction est en préproduction, prête à être vérifiée.'
            accept:
                label: Valider
                description: 'La correction est acceptée : elle attend sa mise en production.'
            refuse:
                label: Refuser
                description: 'La correction ne convient pas : la demande repart en développement, avec le commentaire qui dit pourquoi.'
                prompt: 'Expliquez ce qui ne va pas : un commentaire est obligatoire pour refuser.'
            release:
                label: 'Mettre en production'
                description: 'La correction est en production : la demande est fermée. Elle pourra être rouverte si le problème revient.'
            reopen:
                label: Rouvrir
                description: 'Le problème est revenu : la demande repart en développement.'
            reopen_rejected:
                label: Rouvrir
                description: 'La demande est réexaminée depuis le début.'
    evolution:
        label: Évolution
        transition:
            estimate:
                label: 'À chiffrer'
                description: 'La demande est comprise : elle passe au chiffrage.'
            decline:
                label: Abandonner
                description: "L'évolution ne sera pas réalisée : la demande est fermée."
            submit_estimate:
                label: 'Soumettre le chiffrage'
                description: 'Le chiffrage a été transmis au client : la demande attend sa décision.'
            approve:
                label: 'Accepter le chiffrage'
                description: "Le chiffrage est accepté : l'évolution est planifiée."
            decline_estimate:
                label: 'Refuser le chiffrage'
                description: "Le chiffrage est refusé : l'évolution ne sera pas réalisée et la demande est fermée."
                prompt: 'Un commentaire est obligatoire pour refuser le chiffrage.'
            unplan:
                label: Déplanifier
                description: "Le planning est remis en question : l'évolution retourne à chiffrer."
            start:
                label: Démarrer
                description: 'La réalisation commence.'
            block:
                label: Bloquer
                description: "L'évolution ne peut pas avancer : elle dépend d'un tiers ou d'un prérequis."
                prompt: 'Indiquez ce qui bloque et qui doit le lever.'
            resume:
                label: Reprendre
                description: 'Le blocage est levé : la réalisation reprend.'
            replan:
                label: Replanifier
                description: "Le blocage est levé : l'évolution retourne dans la file de l'équipe."
            deliver:
                label: 'Livrer en recette'
                description: "L'évolution est en préproduction, prête à être vérifiée."
            accept:
                label: Valider
                description: "L'évolution correspond à la demande : elle attend sa mise en production."
            refuse:
                label: Refuser
                description: "L'évolution ne correspond pas à la demande : elle repart en développement, avec le commentaire qui dit pourquoi."
                prompt: 'Expliquez ce qui ne correspond pas à la demande : un commentaire est obligatoire pour refuser.'
            release:
                label: 'Mettre en production'
                description: "L'évolution est en production : la demande est fermée."
            reopen:
                label: Rouvrir
                description: "L'évolution livrée demande une reprise."
            reopen_declined:
                label: Rouvrir
                description: 'La demande est réexaminée depuis le début.'
    task:
        label: 'Tâche interne'
        transition:
            start:
                label: Démarrer
                description: 'La tâche est prise en charge.'
            block:
                label: Bloquer
                description: "La tâche ne peut pas avancer : elle dépend d'un tiers ou d'un prérequis."
                prompt: 'Indiquez ce qui bloque et qui doit le lever.'
            resume:
                label: Reprendre
                description: 'Le blocage est levé : la tâche reprend.'
            deliver:
                label: 'Livrer en recette'
                description: "La tâche est en préproduction, prête à être vérifiée par l'équipe."
            accept:
                label: Valider
                description: 'La recette interne est bonne : la tâche attend sa mise en production.'
            refuse:
                label: Refuser
                description: 'La recette interne échoue : la tâche repart en cours.'
                prompt: 'Expliquez ce qui ne va pas : un commentaire est obligatoire pour refuser.'
            release:
                label: 'Mettre en production'
                description: 'La tâche est en production : elle est faite.'
            cancel:
                label: Annuler
                description: 'La tâche ne sera pas réalisée.'
            reopen:
                label: Rouvrir
                description: 'La tâche repart à faire.'
            reopen_cancelled:
                label: Rouvrir
                description: 'La tâche est de nouveau à faire.'
template:
    name: 'Projet web'
    description: 'Anomalies, évolutions et tâches internes, les demandes confiées au chef de projet référent.'
    tracker:
        bug: 'Quelque chose ne fonctionne plus comme avant.'
        evolution: 'Une nouvelle fonctionnalité ou une amélioration.'
        task: 'Un travail technique sans demande du client.'
    rule:
        to_manager: 'Nouvelle demande au chef de projet'
        client_answers: 'Le client répond : retour au chef de projet'
        reminder: 'Relance du client'
        reminder_body: 'Cette demande attend votre réponse depuis 30 jours. Sans nouvelles de votre part, elle sera fermée dans 15 jours ; elle pourra toujours être rouverte.'
        closing: 'Fermeture sans réponse'
